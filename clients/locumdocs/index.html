<!doctype html>
<html lang="en">

<title>Bayshore Health × Sendoc Locums · Proposal</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Geist+Mono:wght@400;500;600&family=Geist:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bone:#F4F5F3; --surface:#FFFFFF; --ink:#0E1D28; --ink-soft:#4B5A63; --ink-faint:#8A949A;
    --clay:#D97757; --clay-deep:#BE5C3C; --clay-wash:#FBEEE7; --line:#DEDFD9;
    --serif:"Fraunces","Iowan Old Style",Palatino,Georgia,serif;
    --sans:"Geist",-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
    --mono:"Geist Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:var(--bone);color:var(--ink);font-family:var(--sans);
    display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;
    -webkit-font-smoothing:antialiased;}
  .gate{width:100%;max-width:440px;}
  .lockup{display:flex;align-items:center;gap:11px;margin-bottom:30px;}
  .lockup-text{font-family:var(--serif);font-weight:600;line-height:.95;letter-spacing:-.01em;}
  .lockup-text .b{font-size:21px;}
  .lockup-text .h{font-size:15px;letter-spacing:.02em;}
  .lockup .slash{color:var(--line);font-size:24px;font-weight:300;}
  .lockup img{height:26px;width:auto;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:30px 30px 26px;
    box-shadow:0 1px 2px rgba(14,29,40,.04),0 16px 40px rgba(14,29,40,.09);}
  .label{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--clay);font-weight:500;}
  h1{font-family:var(--serif);font-weight:600;font-size:27px;line-height:1.1;letter-spacing:-.01em;margin:12px 0 8px;}
  h1 em{font-style:italic;color:var(--clay);}
  .tagline{color:var(--ink-soft);font-size:14.5px;margin:0 0 22px;line-height:1.5;}
  form{display:flex;flex-direction:column;gap:12px;}
  label.f{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);}
  input[type=password]{font-family:var(--sans);font-size:15px;color:var(--ink);background:var(--bone);
    border:1px solid var(--line);border-radius:9px;padding:12px 13px;width:100%;}
  input[type=password]:focus{outline:none;border-color:var(--clay);box-shadow:0 0 0 3px var(--clay-wash);}
  button{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:500;
    background:var(--clay);color:#fff;border:none;border-radius:9px;padding:13px 16px;cursor:pointer;margin-top:2px;}
  button:hover{background:var(--clay-deep);}
  button:disabled{opacity:.6;cursor:default;}
  .status{min-height:18px;font-size:13px;color:var(--clay-deep);font-family:var(--mono);}
  .footnote{margin-top:20px;font-size:12px;color:var(--ink-faint);}
  .footnote strong{color:var(--ink-soft);}
  /* unlocked: full-page iframe */
  body.unlocked{display:block;padding:0;background:var(--bone);}
  body.unlocked .gate{display:none;}
  #frame{display:none;border:0;width:100%;height:100vh;}
  body.unlocked #frame{display:block;}
</style>
</head>
<body>

<div class="gate">
  <div class="lockup">
    <div class="lockup-text"><div class="b">Bayshore</div><div class="h">Health</div></div>
    <span class="slash">/</span>
    <img src="../../uploads/palm-recolored.png" alt="" />
  </div>
  <div class="card">
    <div class="label">§ Engagement proposal · for Sendoc Locums</div>
    <h1>A proposal, <em>prepared for Sendoc Locums</em>.</h1>
    <p class="tagline">Access-controlled. Enter the password shared with you to view it.</p>
    <form id="gate" autocomplete="off">
      <label class="f" for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="off" autofocus required>
      <button id="submit" type="submit">Unlock &rarr;</button>
      <div id="status" class="status"></div>
    </form>
    <div class="footnote">Issues viewing this? Contact <strong>hello@bayshore.health</strong>.</div>
  </div>
</div>

<iframe id="frame" title="Proposal"></iframe>

<script>
(function () {
  const KEY = 'ld_pw';
  const PAYLOAD = 'payload.json';
  const form = document.getElementById('gate');
  const input = document.getElementById('password');
  const btn = document.getElementById('submit');
  const status = document.getElementById('status');
  const frame = document.getElementById('frame');

  function b64ToBytes(b64){ const bin=atob(b64); const out=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i); return out; }
  async function deriveKey(pw, salt, iters){
    const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), {name:'PBKDF2'}, false, ['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:iters, hash:'SHA-256'}, material, {name:'AES-GCM', length:256}, false, ['decrypt']);
  }
  async function decrypt(pw){
    const res = await fetch(PAYLOAD, {cache:'no-store'});
    if(!res.ok) throw new Error('payload fetch failed: '+res.status);
    const p = await res.json();
    const key = await deriveKey(pw, b64ToBytes(p.salt), p.iterations);
    const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64ToBytes(p.iv)}, key, b64ToBytes(p.ciphertext));
    return new TextDecoder().decode(plain);
  }
  async function unlock(pw, silent){
    try {
      const html = await decrypt(pw);
      frame.srcdoc = html;
      document.body.classList.add('unlocked');
      sessionStorage.setItem(KEY, pw);
    } catch (err) {
      if (silent) { sessionStorage.removeItem(KEY); return; }
      status.textContent = 'Incorrect password. Try again.';
      input.value=''; input.focus(); btn.disabled=false;
    }
  }
  const saved = sessionStorage.getItem(KEY);
  if (saved) { unlock(saved, true); }
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const pw = input.value;
    if(!pw) return;
    btn.disabled = true; status.textContent = 'Decrypting…';
    await unlock(pw, false);
  });
})();
</script>
</body>
</html>
